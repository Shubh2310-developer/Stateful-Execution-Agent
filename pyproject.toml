[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stateful-execution-agent"
version = "0.1.0"
description = "A powerful agentic AI coding assistant for stateful execution."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn[standard]>=0.27.1",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "groq>=0.4.2",
    "pymongo>=4.6.1",
    "motor>=3.3.2",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "redis>=5.0.1",
    "hiredis>=2.3.2",
    "kafka-python>=2.0.2",
    "aiokafka>=0.10.0",
    "torch>=2.1.2",
    "sentence-transformers>=2.3.1",
    "transformers>=4.37.2",
    "numpy>=1.26.3",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "jsonschema>=4.21.1",
    "orjson>=3.9.13",
    "msgpack>=1.0.7",
    "pypdf>=4.0.1",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.3",
    "loguru>=0.7.2",
    "python-json-logger>=2.0.7",
    "prometheus-client>=0.19.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "tenacity>=8.2.3",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.4",
    "pytest-cov>=4.1.0",
    "black>=24.1.1",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "isort>=5.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3
