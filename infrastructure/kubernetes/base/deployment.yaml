apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateful-agent-api
  labels:
    app: stateful-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stateful-agent
  template:
    metadata:
      labels:
        app: stateful-agent
    spec:
      containers:
      - name: api
        image: stateful-agent:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: agent-config
        - secretRef:
            name: agent-secrets
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateful-agent-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stateful-agent-worker
  template:
    metadata:
      labels:
        app: stateful-agent-worker
    spec:
      containers:
      - name: worker
        image: stateful-agent:latest
        command: ["celery", "-A", "src.orchestration.workflow_engine", "worker", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: agent-config
        - secretRef:
            name: agent-secrets
