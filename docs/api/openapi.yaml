openapi: 3.0.0
info:
  title: Stateful Execution Agent API
  description: API for managing autonomous, stateful AI agents.
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /tasks/create:
    post:
      summary: Create a new task
      responses:
        '200':
          description: Task created and planning initiated
  /tasks/{task_id}/status:
    get:
      summary: Get task progress
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
  /tasks/{task_id}/continue:
    post:
      summary: Resume or modify a task
  /state/{task_id}:
    get:
      summary: Get full task state
  /trace/{task_id}:
    get:
      summary: Get decision trace log
  /artifacts/task/{task_id}:
    get:
      summary: List artifacts for a task
  /memory/{user_id}:
    get:
      summary: Get user long-term memory
  /health:
    get:
      summary: Health check
