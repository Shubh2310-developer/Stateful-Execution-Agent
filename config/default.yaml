app:
  name: "Stateful Execution Agent"
  version: "0.1.0"
  env: "development"

llm:
  provider: "groq"
  model: "llama-3.1-8b-instant"
  temperature: 0.0
  max_tokens: 4096

database:
  mongodb_uri: "mongodb://localhost:27017"
  mongodb_db: "agent_state"
  postgres_uri: "postgresql://postgres:postgres@localhost:5432/agent_db"

storage:
  local_root: "./data/storage"

cache:
  enabled: true
  redis_uri: "redis://localhost:6379/0"
  ttl:
    task_state: 300      # 5 minutes
    user_memory: 600     # 10 minutes
    task_artifacts: 300  # 5 minutes

security:
  api_key_header: "X-API-KEY"
  jwt_secret: "super-secret-key"
  jwt_algorithm: "HS256"
