# Prometheus configuration for Stateful Execution Agent monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "agent_alerts.yml"

scrape_configs:
  - job_name: 'stateful-agent-api'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    
  - job_name: 'mongodb-exporter'
    static_configs:
      - targets: ['localhost:9216']
    scrape_interval: 30s
    
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['localhost:9121']
    scrape_interval: 30s
    
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - localhost:9093